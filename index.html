<!DOCTYPE html>
<html>
<head>
    <title>Scheda Personaggio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"; charset="UTF-8">
    <link rel="stylesheet" href="assets/stile scheda.css">
</head>
<body>
    <header>
        <div id="nome-classe-pg">
            <label>
             <input type="text" id="nome-personaggio" placeholder="Nome personaggio">
             <input type="text" id="classe-personaggio" placeholder="Classe personaggio">
            </label>
        </div>
    </header>
 <main>
    <div id="contenitore-tabella-statistiche">
        <div class="valore-tabella">
            <p>attacco</p>
            <input type="number" id="attacco" value="0" min="0">
            <button class="meno" data-stat="attacco">-</button>
            <button class="piu" data-stat="attacco">+</button>
        </div>

        <div class="valore-tabella">
            <p>difesa</p>
            <input type="number" id="difesa" value="0" min="0">
            <button class="meno" data-stat="difesa">-</button>
            <button class="piu" data-stat="difesa">+</button>
        </div>

        <div class="valore-tabella">
            <p>movimento</p>
            <input type="number" id="movimento" value="0" min="0">
            <button class="meno" data-stat="movimento">-</button>
            <button class="piu" data-stat="movimento">+</button>
        </div>

        <div class="valore-tabella">
            <p>punti mente</p>
            <input type="number" id="mana" value="0" min="0">
            <button class="meno" data-stat="mana">-</button>
            <button class="piu" data-stat="mana">+</button>
        </div>

        <div class="valore-tabella">
            <p>punti corpo</p>
            <input type="number" id="punti corpo" value="0" min="0">
            <button class="meno" data-stat="punti corpo">-</button>
            <button class="piu" data-stat="punti corpo">+</button>
        </div>

        <div class="valore-tabella">
            <p>armatura</p>
            <input type="number" id="armatura" value="0" min="0">
            <button class="meno" data-stat="armatura">-</button>
            <button class="piu" data-stat="armatura">+</button>
        </div>

    </div>

    <div id="puntoGenericoContainer">
        <h2>Punto generico</h2>
        <div class="progressione-generico"></div>
    </div>
    
    <div class="capacità-base">
            <h2>Capacità base</h2>
            <textarea id="capacità" rows="5" placeholder="Scrivi qui le abilità base..."></textarea>
        </div>

        <div class="capacità-speciale">
            <h2>Capacità speciale</h2>
            <textarea id="capacità-speciale" rows="5" placeholder="Scrivi qui le abilità speciali..."></textarea>
        </div>

        <div class="lista-equipaggiamento" id="listaEquipaggiamento">

                <h2>Equipaggiamento</h2>
                <button id="aggiungiOggetto">+ Aggiungi oggetto</button>
        
            <div id="contenitoreOggetti"></div>
        </div>

        
        
        <div class="appunti-container">
            <h2>Appunti di Viaggio</h2>
            <textarea id="appunti" rows="10" placeholder="Scrivi qui gli appunti del viaggio..."></textarea>
        </div>
        
        <div id="listaAbilita">
            <h2>imprese / abilità</h2>
            <button id="aggiungiAbilita">+ aggiungi impresa</button>
            <div id="contenitoreAbilita"></div>
        </div>

        <aside>
            <div id="tabellaAfflizioni">
                <h2>Afflizioni</h2>
            <div id="contenitoreAfflizioni"></div>
            </div>
        </aside>
 </main>
 <footer>
    <div id="ultima-modifica" style="margin-top:10px; font-style:italic;">
        Ultimo salvataggio: <span id="data-salvataggio">mai</span>
        <br>
        <button id="esporta">Esporta scheda in JSON</button>
            <input type="file" id="importaFile" accept=".json" style="display:none;">
            <button id="importa">Importa scheda da JSON</button>
        <button id="reset">Reset scheda</button>
    </div>
</footer>

<script src="assets/funzioni scheda.js"></script>
</body>
</html>
